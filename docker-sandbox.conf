# A drop-in for docker.service (`make install-sandbox`): iptables rules don't
# survive a reboot, so the worker's firewall (sandbox.sh) goes back in before
# dockerd starts the container, and is checked again once dockerd is up. A
# failure here never stops Docker.
[Service]
ExecStartPre=-/usr/local/sbin/remote-sandbox
ExecStartPost=-/usr/local/sbin/remote-sandbox
